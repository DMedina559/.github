name: Reusable Sync Contracts

on:
  workflow_call:
    inputs:
      target-branch:
        description: Base branch for the generated PR
        required: false
        default: dev
        type: string
      backend-ref:
        description: Exact bedrock-server-manager commit SHA or ref to sync from
        required: false
        default: dev
        type: string
      contract-hash:
        description: Optional SHA-256 hash of the exported backend OpenAPI contract
        required: false
        default: ''
        type: string
      setup-node:
        description: Whether to set up Node.js
        required: false
        default: false
        type: boolean
      node-version:
        description: Node.js version if setup-node is true
        required: false
        default: '24'
        type: string
      install-command:
        description: Command to install caller dependencies before codegen
        required: false
        default: ''
        type: string
      openapi-output:
        description: Path where backend OpenAPI JSON should be written
        required: true
        type: string
      generate-command:
        description: Command to regenerate contracts, models, or docs
        required: true
        type: string
      verify-command:
        description: Command to run tests and hooks before opening/updating the PR
        required: false
        default: ''
        type: string
      pr-title:
        description: Pull request title
        required: false
        default: 'chore(sync): update generated contracts and docs from bedrock-server-manager'
        type: string
      pr-branch:
        description: Pull request branch name
        required: false
        default: 'chore/sync-bsm-contracts'
        type: string
    secrets:
      SYNC_APP_ID:
        required: false
      SYNC_APP_PRIVATE_KEY:
        required: false
      CROSS_REPO_TOKEN:
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve sync token
        id: auth
        uses: DMedina559/.github/actions/get-sync-token@main
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          fallback-token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Validate sync token
        if: steps.auth.outputs.token == ''
        run: |
          echo "Configure SYNC_APP_ID + SYNC_APP_PRIVATE_KEY (recommended) or CROSS_REPO_TOKEN." >&2
          exit 1

      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          token: ${{ steps.auth.outputs.token }}

      - name: Checkout bedrock-server-manager
        uses: actions/checkout@v7
        with:
          repository: DMedina559/bedrock-server-manager
          ref: ${{ inputs.backend-ref }}
          path: .bsm-backend
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up Node.js
        if: inputs.setup-node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install backend for contract export
        run: python -m pip install -e ./.bsm-backend

      - name: Install target repository dependencies
        if: inputs.install-command != ''
        run: ${{ inputs.install-command }}

      - name: Export backend OpenAPI contract
        id: export
        run: |
          mkdir -p "$(dirname "${{ inputs.openapi-output }}")"
          python -m bedrock_server_manager.web.contract --output "${{ inputs.openapi-output }}"
          hash=$(sha256sum "${{ inputs.openapi-output }}" | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Regenerate downstream artifacts
        run: ${{ inputs.generate-command }}

      - name: Clean temporary backend checkout before diff check
        id: changes
        run: |
          rm -rf .bsm-backend
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No contract or generated artifact changes detected; skipping tests and PR."
          fi

      - name: Run consumer tests and hooks
        if: steps.changes.outputs.changed == 'true' && inputs.verify-command != ''
        run: ${{ inputs.verify-command }}

      - name: Create or update Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.auth.outputs.token }}
          base: ${{ inputs.target-branch }}
          branch: ${{ inputs.pr-branch }}
          delete-branch: true
          title: ${{ inputs.pr-title }}
          commit-message: ${{ inputs.pr-title }}
          body: |
            Automated sync triggered by `DMedina559/bedrock-server-manager` (`${{ inputs.backend-ref }}`).

            - Contract SHA-256: `${{ inputs.contract-hash || steps.export.outputs.hash }}`
            - Consumer verification ran before opening/updating this PR.
          labels: |
            chore
            dependencies

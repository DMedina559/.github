name: Reusable Python Lint

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        required: false
        default: '3.14'
        type: string
      install-target:
        description: Pip install arguments
        required: false
        default: "-e '.[dev]'"
        type: string
      cache-dependency-path:
        description: Path(s) to dependency files for pip caching
        required: false
        default: pyproject.toml
        type: string
      extra-commands:
        description: Additional shell commands to run after pre-commit
        required: false
        default: ''
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - name: Install dependencies
        run: python -m pip install ${{ inputs.install-target }}
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Run extra lint checks
        if: inputs.extra-commands != ''
        run: ${{ inputs.extra-commands }}

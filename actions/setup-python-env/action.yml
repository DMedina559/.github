name: Setup Python Environment
description: Set up Python with pip caching and install dependencies

inputs:
  python-version:
    description: Python version
    required: false
    default: '3.14'
  cache-dependency-path:
    description: Dependency file(s) for pip cache
    required: false
    default: pyproject.toml
  install-args:
    description: Arguments passed to python -m pip install
    required: false
    default: "-e '.[dev]'"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install Python dependencies
      if: inputs.install-args != ''
      shell: bash
      run: python -m pip install ${{ inputs.install-args }}
